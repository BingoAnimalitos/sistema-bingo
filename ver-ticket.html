<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Ticket - Bingo Animalitos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f1f5f9; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: #fff; 
            max-width: 380px; 
            width: 100%;
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
        }
        h2 { font-size: 16px; color: #2c3e50; margin-bottom: 5px; text-transform: uppercase; }
        .ticket-info { font-size: 11px; text-align: left; margin: 10px 0; line-height: 1.4; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 8px 0; }
        
        .tabla-carton { width: 100%; border-collapse: collapse; margin: 8px 0; table-layout: fixed; }
        .tabla-carton td { border: 1.5px solid #000; height: 26px; text-align: center; font-size: 9px; font-weight: bold; padding: 0; }
        
        /* Estilos de estados y aciertos idénticos al panel */
        .celda-premiada { background-color: #2ecc71 !important; color: white !important; border: 2px solid #27ae60 !important; }
        .celda-marcada-sorteo { background-color: #3498db !important; color: white !important; border: 2px solid #2980b9 !important; }

        .badge-ganador { background-color: #27ae60; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; font-size: 10px; }
        .badge-no-ganado { background-color: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; font-size: 10px; }
        .badge-pendiente { background-color: #f39c12; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; font-size: 10px; }

        .ticket-footer { font-size: 8.5px; font-weight: bold; margin-top: 10px; text-align: center; line-height: 1.3; }
        #mensajeCarga { font-size: 13px; color: #555; padding: 20px; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>

    <div class="card" id="cardContenedor">
        <div id="mensajeCarga">🔍 Consultando ticket en el sistema...</div>
        <div id="contenidoTicketPublico" style="display: none;">
            <h2>Bingo Animalitos</h2>
            <div style="font-size: 10px; font-weight: bold;">Lotto Activo y La Granjita</div>
            
            <div class="ticket-info" id="detallesInfoTicket"></div>
            
            <div id="contenedorTablasCartones"></div>

            <div class="ticket-footer">
                Revise sus tickets.<br>
                Si hay 2 o más ganadores al mismo tiempo, el pote acumulado se reparte por igual.<br>
                ¡Mucha Suerte! 🍀
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzbbGiq4txDkhac4hp0h27Cy35NPeff91n1UrtSaZF7j0Bmdq2WMKi54QISa5bZjUoS/exec";

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const ticketId = params.get('ticket') || params.get('id');

            if (!ticketId) {
                document.getElementById("mensajeCarga").innerHTML = "❌ No se ha especificado ningún ticket en el enlace.";
                return;
            }

            try {
                // Consulta al backend para obtener los datos del ticket y el estado actual del sorteo
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ accion: "consultarTicketPublico", idTicket: ticketId })
                });

                const data = await response.json();

                if (data.exito && data.ticket) {
                    renderizarTicketPublico(data.ticket, data.animalesSorteo || []);
                } else {
                    document.getElementById("mensajeCarga").innerHTML = "⚠️ No se encontró información para el ticket: <strong>" + ticketId + "</strong>";
                }
            } catch (error) {
                document.getElementById("mensajeCarga").innerHTML = "❌ Error de conexión al consultar el ticket.";
            }
        };

        function renderizarTicketPublico(ticket, animalesSorteo) {
            document.getElementById("mensajeCarga").style.display = "none";
            document.getElementById("contenidoTicketPublico").style.display = "block";

            let idT = ticket.idTicket || ticket.IdTicket || ticket.IDTICKET || ticket.ticket || 'N/D';
            let fechaT = ticket.fecha || ticket.Fecha || ticket.FECHA || 'N/D';
            let sorteoT = ticket.sorteo || ticket.Sorteo || ticket.SORTEO || 'Sorteo Activo';
            let vendedorT = ticket.vendedor || ticket.Vendedor || ticket.VENDEDOR || 'Sistema';
            let estadoT = ticket.estado || ticket.Estado || ticket.ESTADO || 'Pendiente';
            let modalidadT = ticket.modalidad || ticket.Modalidad || ticket.MODALIDAD || 'En juego';

            let claseBadge = "badge-pendiente";
            let estadoUpper = estadoT.toUpperCase();
            if (estadoUpper.includes("GANADOR")) claseBadge = "badge-ganador";
            else if (estadoUpper.includes("NO") || estadoUpper.includes("PERDIÓ")) claseBadge = "badge-no-ganado";

            document.getElementById("detallesInfoTicket").innerHTML = `
                <div><strong>TICKET:</strong> ${idT}</div>
                <div><strong>FECHA:</strong> ${fechaT}</div>
                <div><strong>SORTEO:</strong> ${sorteoT}</div>
                <div><strong>VENDEDOR:</strong> ${vendedorT}</div>
                <div><strong>ESTADO:</strong> <span class="${claseBadge}">${estadoT}</span></div>
            `;

            // Procesar los números del cartón (puede venir como string separado por comas o array JSON)
            let numsArray = ticket.numeros || ticket.Numeros || ticket.NUMEROS || ticket.carton || [];
            if (typeof numsArray === 'string') {
                try {
                    numsArray = numsArray.trim().startsWith('[') ? JSON.parse(numsArray) : numsArray.split(',').map(s => s.trim());
                } catch(e) {
                    numsArray = numsArray.split(',').map(s => s.trim());
                }
            }

            let tablaHtml = '<table class="tabla-carton"><tr>';
            numsArray.forEach((num, index) => {
                if (index > 0 && index % 4 === 0) {
                    tablaHtml += '</tr><tr>';
                }
                let numLimpio = num ? num.toString().replace(/\s+/g, ' ').trim() : '';
                let claseCelda = "";

                let animalNum = numLimpio.split(" ")[0].trim();
                let animalNom = numLimpio.replace(animalNum, "").trim().toLowerCase();

                // Validar si el animalito salió en el sorteo actual para resaltarlo en azul o verde ganador
                let salio = animalesSorteo.some(a => {
                    let aStr = a.toString().toLowerCase().trim();
                    let aPartes = aStr.split(" ");
                    let aNum = aPartes[0].trim();
                    let aNom = aPartes.slice(1).join(" ").trim();

                    return aStr === numLimpio.toLowerCase() || 
                           aStr === animalNum.toLowerCase() || 
                           (animalNom !== "" && aStr.includes(animalNom)) ||
                           (animalNom !== "" && aNom.includes(animalNum));
                });

                if (estadoUpper.includes("GANADOR")) {
                    claseCelda = "celda-premiada"; // Verde si el ticket ganó
                } else if (salio) {
                    claseCelda = "celda-marcada-sorteo"; // Azul si salió en el bolillero
                }

                tablaHtml += `<td class="${claseCelda}">${numLimpio}</td>`;
            });
            tablaHtml += '</tr></table>';

            document.getElementById("contenedorTablasCartones").innerHTML = tablaHtml;
        }
    </script>
</body>
</html>
