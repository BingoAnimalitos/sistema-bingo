<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Animalitos Online - Ticket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; text-align: center; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .card-container { background: #fff; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; font-size: 18px; margin-bottom: 15px; }
        .info { margin-bottom: 15px; font-size: 13px; color: #555; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e1e8ed; line-height: 1.5; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .cell { background: #f8f9fa; border: 1px solid #cbd5e1; padding: 12px 4px; font-size: 11px; font-weight: bold; border-radius: 6px; color: #333; }
        .cell.marked { background: #3498db !important; color: white !important; border-color: #2980b9 !important; }
        .cell.winner { background: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .btn-tv {
            display: block;
            margin-top: 15px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .btn-tv:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="card-container">
        <h2>🦁 Bingo Animalitos Online 🎰</h2>
        <div class="info" id="ticket-info">
            Cargando detalles del ticket...
        </div>
        
        <div class="grid" id="animal-grid">
            <!-- Los animalitos se cargaran dinamicamente aqui sin datos quemados -->
            <div class="cell" style="grid-column: span 4; background: #fff; border: none; color: #666;">Cargando jugada...</div>
        </div>

        <!-- Enlace de Resultados TV -->
        <a href="https://bingoanimalitos.github.io/sistema-bingo/resultados.html" target="_blank" class="btn-tv">
            📺 Ver Resultados en Vivo (TV)
        </a>
    </div>

    <script>
        // --- CAPAS DE SEGURIDAD ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function (event) {
            if (event.keyCode === 123) { event.preventDefault(); return false; }
            if (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74 || event.keyCode === 67)) { event.preventDefault(); return false; }
            if (event.ctrlKey && event.keyCode === 85) { event.preventDefault(); return false; }
            if (event.ctrlKey && event.keyCode === 83) { event.preventDefault(); return false; }
        });

        // --- LOGICA DINÁMICA DEL TICKET ---
        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('ticket') || urlParams.get('id') || 'No especificado';
        const cedulaJugador = urlParams.get('cedula') || 'No especificada';

        // Mostrar la info principal en el encabezado del ticket
        document.getElementById('ticket-info').innerHTML = `
            <strong>ID Ticket:</strong> ${ticketId}<br>
            <strong>Cédula Pagomóvil:</strong> ${cedulaJugador}<br>
            <strong>Estado:</strong> <span style="color: green; font-weight: bold;">Conectado en vivo 🟢</span>
        `;

        const gridElement = document.getElementById('animal-grid');

        function renderizarCarton(listaAnimales) {
            gridElement.innerHTML = '';
            if (!listaAnimales || listaAnimales.length === 0) {
                gridElement.innerHTML = '<div class="cell" style="grid-column: span 4;">No hay animalitos registrados para este ticket.</div>';
                return;
            }
            
            listaAnimales.forEach(animal => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.innerText = animal;
                gridElement.appendChild(div);
            });
        }

        // OPCIÓN A: Si pasas los animalitos directamente por la URL separados por coma (ej: ?ticket=TK-225648&cedula=123456&animales=24%20Iguana,12%20Caballo...)
        const animalesParam = urlParams.get('animales');
        if (animalesParam) {
            const animalesArray = animalesParam.split(',').map(item => decodeURIComponent(item.trim()));
            renderizarCarton(animalesArray);
        } else {
            // OPCIÓN B: Si prefieres consultarlo directamente a tu Google Apps Script backend usando el ticketId
            // Reemplaza 'TU_URL_DE_APPS_SCRIPT' con tu Web App desplegada si usas consulta por API:
            /*
            fetch(`TU_URL_DE_APPS_SCRIPT?action=obtenerTicket&id=${ticketId}`)
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('ticket-info').innerHTML = `
                            <strong>ID Ticket:</strong> ${data.ticketId}<br>
                            <strong>Cédula Pagomóvil:</strong> ${data.cedula || 'No especificada'}<br>
                            <strong>Estado:</strong> <span style="color: green; font-weight: bold;">Conectado en vivo 🟢</span>
                        `;
                        renderizarCarton(data.animales);
                    } else {
                        gridElement.innerHTML = '<div class="cell" style="grid-column: span 4; color: red;">Ticket no encontrado.</div>';
                    }
                })
                .catch(err => {
                    gridElement.innerHTML = '<div class="cell" style="grid-column: span 4; color: red;">Error al conectar con el servidor.</div>';
                });
            */
            
            // Mensaje temporal si no se pasaron por URL ni se configuró el fetch aún
            gridElement.innerHTML = '<div class="cell" style="grid-column: span 4; color: #555;">Esperando datos de la jugada...</div>';
        }
    </script>
</body>
</html>
